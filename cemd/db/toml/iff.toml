# iff.toml
# Force field parameters for IFF (Interface Force Field)
# Reference: https://doi.org/10.1039/C4DT00438H

[model]
name = "IFF"
reference = "https://doi.org/10.1039/C4DT00438H"
description = "Interface Force Field for cement minerals"

# ============================================================
# Atom Types
# ============================================================

[atom_types]

[atom_types.ac1]
element = "Al"
charge = 1.2
environment = "aluminate ring in c3a"
ref = "https://doi.org/10.1039/C4DT00438H"

[atom_types.ca_a_a]
element = "Ca"
charge = 1.5
environment = "calcium ions in c3a"
ref = "https://doi.org/10.1039/C4DT00438H"

[atom_types.ca_plus_plus]
element = "Ca"
charge = 1.5
environment = "calcium ion in c3s"
ref = "https://doi.org/10.1021/jp312815g"

[atom_types.hoc_c3a]
element = "H"
charge = 0.25
environment = "superficial hydroxide ion in c3a"
ref = "https://doi.org/10.1016/j.cemconres.2017.06.006"

[atom_types.hoc_c3s]
element = "H"
charge = 0.3
environment = "superficial hydroxide ion in c3s"
ref = "https://doi.org/10.1016/j.cemconres.2017.06.006"

[atom_types.hoca]
element = "H"
charge = 0.3
environment = "aloh group in c3a"
ref = "https://doi.org/10.1039/C4DT00438H"

[atom_types.hos]
element = "H"
charge = 0.4
environment = "silanol group in c3s"
ref = "https://doi.org/10.1016/j.cemconres.2017.06.006"

[atom_types.h_silica]
element = "H"
charge = 0.4
environment = "hydrogen atom in silica"
ref = "https://doi.org/10.1021/cm500365c"

[atom_types.oc1]
element = "O"
charge = -1.0
environment = "silicate ion in c3s"
ref = "https://doi.org/10.1021/jp312815g"

[atom_types.oc2]
element = "O"
charge = -1.5
environment = "oxide ion in c3s"
ref = "https://doi.org/10.1021/jp312815g"

[atom_types.oc3]
element = "O"
charge = -0.75
environment = "aluminate ring in c3a"
ref = "https://doi.org/10.1039/C4DT00438H"

[atom_types.oc4]
element = "O"
charge = -1.35
environment = "aluminate apical in c3a"
ref = "https://doi.org/10.1039/C4DT00438H"

[atom_types.oc5_c3a]
element = "O"
charge = -1.0
environment = "superficial hydroxide ion in c3a"
ref = "https://doi.org/10.1039/C4DT00438H"

[atom_types.oc5_c3s]
element = "O"
charge = -1.05
environment = "superficial hydroxide ion in c3s"
ref = "https://doi.org/10.1016/j.cemconres.2017.06.006"

[atom_types.oc5a]
element = "O"
charge = -0.9
environment = "aloh group in c3a and aft"
ref = "https://doi.org/10.1039/C4DT00438H"

[atom_types.oc6]
element = "O"
charge = -0.65
environment = "silanol group in c3s"
ref = "https://doi.org/10.1016/j.cemconres.2017.06.006"

[atom_types.o_silica_bulk]
element = "O"
charge = -0.675
environment = "oxygen atom in silica (bulk)"
ref = "https://doi.org/10.1021/cm500365c"

[atom_types.o_silica_silanol]
element = "O"
charge = -0.55
environment = "oxygen atom in silica (silanol)"
ref = "https://doi.org/10.1021/cm500365c"

[atom_types.sc1]
element = "Si"
charge = 1.0
environment = "silicate ion in c3s"
ref = "https://doi.org/10.1016/j.cemconres.2017.06.006"

[atom_types.si_silica]
element = "Si"
charge = 1.1
environment = "silicium atom in silica"
ref = "https://doi.org/10.1021/cm500365c"

