# solcon.toml
# SolCon - Solubility-consistent force field for calcium carbonate
# Reference: https://doi.org/10.1098/rsta.2022.0250

[model]
name = "SolCon"
reference = "https://doi.org/10.1098/rsta.2022.0250"
description = "Force field for calcium carbonate (solubility-consistent)"

# ============================================================
# Atom Types
# ============================================================

[atom_types]

[atom_types.ca_solcon]
element = "Ca"
charge = 2.0
environment = "calcium in calcium carbonate (solubility-consistent)"
ref = "https://doi.org/10.1098/rsta.2022.0250"

[atom_types.cc_solcon]
element = "C"
charge = 1.423285
environment = "carbon in calcium carbonate (solubility-consistent)"
ref = "https://doi.org/10.1098/rsta.2022.0250"

[atom_types.oc_solcon]
element = "O"
charge = -1.14109
environment = "oxygen in calcium carbonate (solubility-consistent)"
ref = "https://doi.org/10.1098/rsta.2022.0250"

# ============================================================
# Lennard-Jones 12-6 Parameters
# ============================================================

[lj]

[lj."ca_solcon-ca_solcon"]
epsilon = 0.1
sigma = 2.87199
ref = "https://doi.org/10.1098/rsta.2022.0250"

[lj."cc_solcon-cc_solcon"]
epsilon = 0.0576286
sigma = 2.784959
ref = "https://doi.org/10.1098/rsta.2022.0250"

[lj."oc_solcon-oc_solcon"]
epsilon = 0.1554
sigma = 3.1655
ref = "https://doi.org/10.1098/rsta.2022.0250"

# ============================================================
# Bond Parameters
# ============================================================

[bond]

[bond."cc_solcon-oc_solcon"]
k = 770
r0 = 1.3

# ============================================================
# Angle Parameters
# ============================================================

[angle]

[angle."oc_solcon-cc_solcon-oc_solcon"]
k = 110
theta0 = 120