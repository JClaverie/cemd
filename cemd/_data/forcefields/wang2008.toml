# wang2008.toml
# Force field for vaterite
# Reference: https://doi.org/10.2138/am.2009.2939

[model]
name = "Wang 2008"
reference = "https://doi.org/10.2138/am.2009.2939"
description = "Force field for vaterite"

# ============================================================
# Atom Types
# ============================================================

[atom_types]

[atom_types.cac]
element = "Ca"
charge = 2.0
environment = "calcium in vaterite"
ref = "https://doi.org/10.2138/am.2009.2939"

[atom_types.ccc]
element = "C"
charge = 1.123
environment = "carbon in vaterite"
ref = "https://doi.org/10.2138/am.2009.2939"

[atom_types.occ]
element = "O"
charge = -1.041
environment = "oxygen in vaterite"
ref = "https://doi.org/10.2138/am.2009.2939"

# ============================================================
# Lennard-Jones 12-6 Parameters
# ============================================================

[lj]

[lj."cac-cac"]
epsilon = 0.1
sigma = 2.87198
ref = "https://doi.org/10.2138/am.2009.2939"

[lj."ccc-ccc"]
epsilon = 0.0576286145988961
sigma = 2.78495919333787
ref = "https://doi.org/10.2138/am.2009.2939"

[lj."occ-occ"]
epsilon = 0.1554
sigma = 3.1655
ref = "https://doi.org/10.2138/am.2009.2939"

# ============================================================
# Bond Parameters
# ============================================================

[bond]

[bond."ccc-occ"]
k = 770
r0 = 1.3
ref = "https://doi.org/10.2138/am.2009.2939"

# ============================================================
# Angle Parameters
# ============================================================

[angle]

[angle."occ-ccc-occ"]
k = 110
theta0 = 120
ref = "https://doi.org/10.2138/am.2009.2939"

# ============================================================
# Improper Parameters
# ============================================================

[improper]

[improper."occ-occ-ccc-occ"]
k = 250.956022944551
theta0 = 0
ref = "https://doi.org/10.2138/am.2009.2939"