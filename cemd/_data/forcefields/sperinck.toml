# sperinck.toml
# Force field parameters for Sperinck 2016
# Reference: https://doi.org/10.1063/1.4964301

[model]
name = "Sperinck 2016"
reference = "https://doi.org/10.1063/1.4964301"
description = "Force field for geopolymer/metakaolin"

# ============================================================
# Atom Types
# ============================================================

[atom_types]

