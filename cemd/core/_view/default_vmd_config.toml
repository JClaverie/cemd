# ===============================================================================
# VMD configuration -CEMD
# ===============================================================================
# Copy this file to ~/.config/cemd/vmd_config.toml
# and modify it as needed.

# ===============================================================================
# General settings
# ===============================================================================

resolution = 12
material = "AOEdgy"

[material_options]
options = ["AOEdgy", "AOShiny", "AOChalky"]

[material_settings]
outlinewidth = 0.6
outline = 1.5
shininess = 0.8

# ===============================================================================
# Element types (element → list of types association)
# ===============================================================================

[element_types]
H  = ["H", "Hw", "Hw_aq", "Hw_s", "Hh", "Hh_aq", "Hh_s", "H", "Hsi", "Ha"]
O  = ["O", "Ow", "Ow_aq", "Ow_s", "Oh", "Oh_aq", "Oh_s", "Ob", "Obs", "Osi", "Osih", "Oa", "Oah", "Oc"]
Ca = ["Ca", "Cw", "Ca_s", "Ca_aq"]
Si = ["Si"]
Al = ["Al"]
Na = ["Na"]
Cl = ["Cl"]
K  = ["K"]

# ===============================================================================
# Element colors (hexadecimal format)
# ===============================================================================

[element_colors]
# Non metals
H  = "#FFFFFF"
C  = "#808080"
O  = "#FF0000"
N  = "#304FF0"
S  = "#FFFF00"
P  = "#FF8000"

# Metalloids
Si = "#F5B800"
B  = "#FFB6C1"

# Halogen
Cl = "#00C2FF"

# Alkali metals
Na = "#4500FA"
K  = "#80E666"
Li = "#B22222"
Rb = "#702670"
Cs = "#8B008B"

# Alkaline earth metals
Ca = "#00E580"
Mg = "#8B4513"
Ba = "#00BFFF"
Sr = "#FF6347"

# Transition metals
Fe = "#FF4500"
Al = "#8080FF"
Ti = "#808080"
Mn = "#9B30FF"
Cr = "#00FF7F"
Ni = "#A9A9A9"
Cu = "#FF6347"
Zn = "#7F7FFF"
Zr = "#94E5FF"
V  = "#FF69B4"
Co = "#FF1493"
Mo = "#C0C0C0"
W  = "#B0C4DE"

# Noble metals
Au = "#FFD700"
Ag = "#C0C0C0"
Pt = "#E5E4E2"
Pd = "#D3D3D3"

# Lanthanides
Ce = "#FFFFE0"
Eu = "#FFE4B5"

# Others
Pb = "#C0C0C0"
U  = "#00FF00"
Th = "#00BFFF"

# ===============================================================================
# Radii of atoms (association types → radius)
# ===============================================================================

[element_radii]
"O" = 0.8
"H" = 0.8
"S" = 0.8
"Si" = 0.8
"C" = 0.8
"Al" = 0.8
"Ca" = 1.8
"Cl" = 1.8
"K" = 1.8
"Na" = 1.8

# ===============================================================================
# Thresholds for connections (association types → cutoff)
# ===============================================================================

[bond_cutoffs]
# Hydrogen bonds
"Ow-Hw" = 1.1
"Oh-Hh" = 1.1
"Oah-Ha" = 1.1
"Osih-Hsi" = 1.1
"O-H" = 1.1

# Carbone
"C-C" = 1.8
"C-O" = 1.8
"C-N" = 1.8
"C-S" = 1.8
"C-P" = 1.8
"C-Si" = 1.8
"C-F" = 1.6
"C-Cl" = 1.8
"C-Br" = 1.9
"C-I" = 2.0
"C-H" = 1.2

# C-O bonds
"Oc-C" = 1.6
"O-C" = 1.6

# S-O bonds
"Os-S" = 1.6
"O-S" = 1.6

# Si-O bonds
"Osi-Si" = 1.75
"Ob-Si" = 1.75
"Obs-Si" = 1.75
"Osih-Si" = 1.75
"O-Si" = 1.75

# Al-O bonds
"Oa-Al" = 1.75
"Ob-Al" = 1.75
"Obs-Al" = 1.75
"Oh-Al" = 1.75
"Oah-Al" = 1.75
"O-Al" = 1.75

