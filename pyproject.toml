[project]
name = "cemd"
version = "0.1.0"
description = "Computational Elementary Matter Design"
authors = [{name = "Jérôme Claverie"}]
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "MDAnalysis>=2.10",
    "pymatgen>=2024.0",
    "rdkit",
    "dask",
    "pydantic>=2.0,<3",
    "xlrd",
    "questionary",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "PySide6-Qlementine",
    "pyvista",
    "pyvistaqt",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "numpydoc",
]
dev = [
    "pytest",
    "pytest-cov",
    "ipython",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["test/unit"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort (gestion des imports)
    "N",    # pep8-naming
    "UP",   # pyupgrade
]
unfixable = ["F401"]  # Empêche la suppression automatique des imports non utilisés
ignore = [
    "E501",  # Lignes trop longues (déjà géré par ruff format)
    "N813",  # CamelCase importé en lowercase
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"