<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Field Database Viewer</title>
    <!-- Google Fonts pour les icônes -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=article,search" />
    <style>
        /* ============================================================
           Reset & Base - S'intègre au thème PyData
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--pst-font-family-base, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif);
            background: transparent;
            color: var(--pst-color-text-base, #1a1a2e);
            padding: 0;
        }
        
        /* ============================================================
           Container - Reprend les couleurs du thème
           ============================================================ */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--pst-color-background, white);
            border-radius: 8px;
            padding: 20px;
        }
        
        /* ============================================================
           Controls - Style PyData
           ============================================================ */
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 8px 14px;
            border: 1px solid var(--pst-color-border, #dee2e6);
            border-radius: 6px;
            font-size: 14px;
            font-family: var(--pst-font-family-base, 'Segoe UI', sans-serif);
            background: var(--pst-color-background, white);
            color: var(--pst-color-text-base, #1a1a2e);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box:focus {
            outline: none;
            border-color: var(--pst-color-link, #4a6cf7);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
        }
        .search-box::placeholder {
            color: var(--pst-color-text-muted, #6c757d);
        }
        
        /* ============================================================
           Table - Style PyData
           ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 6px;
            border: 1px solid var(--pst-color-border, #e9ecef);
            max-height: 600px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            font-family: var(--pst-font-family-base, 'Segoe UI', sans-serif);
        }
        thead {
            background: var(--pst-color-surface, #f8f9fa);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th {
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            color: var(--pst-color-heading, #495057);
            border-bottom: 2px solid var(--pst-color-border, #dee2e6);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
            font-size: 12px;
            /* text-transform: uppercase; */
            letter-spacing: 0.5px;
        }
        th:hover { background: var(--pst-color-surface-hover, #e9ecef); }
        th .sort-icon {
            margin-left: 6px;
            opacity: 0.4;
            font-size: 10px;
        }
        th.sorted .sort-icon { opacity: 1; }
        td {
            padding: 8px 14px;
            border-bottom: 1px solid var(--pst-color-border, #f1f3f5);
            vertical-align: middle;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--pst-color-text-base, #1a1a2e);
        }
        tr:hover td { background: var(--pst-color-surface-hover, #f8f9ff); }
        
        .highlight {
            background: #ffd43b;
            padding: 0 2px;
            border-radius: 2px;
        }
        
        .type-link {
            color: var(--pst-color-link, #4a6cf7);
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .type-link:hover {
            color: var(--pst-color-link-hover, #1a3a8a);
            text-decoration: underline;
        }
        .ref-link {
            text-decoration: none;
            color: var(--pst-color-link, #4a6cf7);
            display: inline-block;
            transition: transform 0.15s, color 0.15s;
        }
        .ref-link:hover {
            color: var(--pst-color-link-hover, #1a3a8a);
            transform: scale(1.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
            vertical-align: middle;
            font-size: 18px;
        }
        
        /* ============================================================
           Empty & Loading States
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--pst-color-text-muted, #6c757d);
        }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--pst-color-text-muted, #6c757d);
        }
        .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid var(--pst-color-border, #f3f3f3);
            border-top: 3px solid var(--pst-color-link, #4a6cf7);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* ============================================================
           Modal - Style PyData
           ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex !important; }
        .modal {
            background: var(--pst-color-background, white);
            border-radius: 8px;
            max-width: 1000px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--pst-color-border, #e9ecef);
        }
        .modal-header h2 {
            font-size: 22px;
            font-weight: 600;
            color: var(--pst-color-heading, #1a1a2e);
            margin: 0;
        }
        .modal-header h2 small {
            font-weight: 400;
            font-size: 14px;
            color: var(--pst-color-text-muted, #6c757d);
            margin-left: 10px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--pst-color-text-muted, #6c757d);
            line-height: 1;
            padding: 0 8px;
            transition: color 0.2s;
        }
        .modal-close:hover { color: var(--pst-color-text-base, #1a1a2e); }
        .modal-section { margin-bottom: 24px; }
        .modal-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--pst-color-heading, #495057);
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--pst-color-border, #e9ecef);
        }
        .modal-section h3 .count-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 400;
            background: var(--pst-color-surface, #e9ecef);
            color: var(--pst-color-text-muted, #495057);
            margin-left: 8px;
        }
        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 20px;
        }
        .modal-grid .label {
            color: var(--pst-color-text-muted, #6c757d);
            font-size: 12px;
            font-weight: 500;
            /* text-transform: uppercase; */
            letter-spacing: 0.5px;
        }
        .modal-grid .value { font-weight: 500; }
        .modal-subtable {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 5px;
        }
        .modal-subtable th {
            background: var(--pst-color-surface, #f8f9fa);
            padding: 5px 10px;
            text-align: left;
            font-weight: 600;
            color: var(--pst-color-heading, #495057);
            border-bottom: 1px solid var(--pst-color-border, #dee2e6);
            position: sticky;
            top: 0;
            font-size: 11px;
            /* text-transform: uppercase; */
            letter-spacing: 0.5px;
        }
        .modal-subtable td {
            padding: 4px 10px;
            border-bottom: 1px solid var(--pst-color-border, #f1f3f5);
        }
        .modal-subtable tr:hover td { background: var(--pst-color-surface-hover, #f8f9ff); }
        .badge {
            display: inline-block;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 500;
            background: var(--pst-color-surface, #e9ecef);
            color: var(--pst-color-text-muted, #495057);
            margin: 2px 4px 2px 0;
            /* text-transform: uppercase; */
            letter-spacing: 0.3px;
        }
        .badge-blue { background: #dbeafe; color: #1a3a8a; }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-orange { background: #fef3c7; color: #92400e; }
        .badge-gray { background: var(--pst-color-surface, #e9ecef); color: var(--pst-color-text-muted, #495057); }
        
        /* ============================================================
           Responsive
           ============================================================ */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .controls { flex-direction: column; }
            .search-box { min-width: 100%; }
            td, th { padding: 6px 10px; font-size: 12px; }
            .modal-grid { grid-template-columns: 1fr; }
            .modal { padding: 16px; }
            .modal-subtable { font-size: 11px; }
            .modal-subtable th, .modal-subtable td { padding: 3px 6px; }
        }
        
        /* ============================================================
           Scrollbar
           ============================================================ */
        .table-wrapper::-webkit-scrollbar { height: 8px; width: 8px; }
        .table-wrapper::-webkit-scrollbar-track { background: var(--pst-color-surface, #f1f1f1); border-radius: 4px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: var(--pst-color-border, #c1c7cd); border-radius: 4px; }
        .table-wrapper::-webkit-scrollbar-thumb:hover { background: var(--pst-color-text-muted, #a8b0b8); }
        
        .debug-info {
            margin-top: 10px;
            padding: 10px;
            background: var(--pst-color-surface, #f8f9fa);
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: var(--pst-color-text-muted, #495057);
            display: none;
            border: 1px solid var(--pst-color-border, #e9ecef);
        }
        .debug-info.show { display: block; }
    </style>
</head>
<body>
<div class="container">
    <div class="controls">
        <input class="search-box" id="searchInput" type="text" placeholder="Search across all fields...">
    </div>
    
    <div class="table-wrapper">
        <div id="loadingState" class="loading"><div class="spinner"></div><p>Loading force field data...</p></div>
        <table id="dataTable" style="display:none;">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display:none;"><div class="icon">🔍</div><p id="emptyMessage">No entries found.</p></div>
    </div>
    
    <div id="debugInfo" class="debug-info"></div>
</div>

<!-- ========================================================== -->
<!-- MODAL -->
<!-- ========================================================== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">Model <small id="modalModel"></small></h2>
            <button class="modal-close" id="modalClose">×</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<script>
// ============================================================
// DONNÉES INTÉGRÉES (remplacées par generate_ff_embedded.py)
// ============================================================

const EMBEDDED_DATA = {};

// ============================================================
// STATE
// ============================================================

let allData = {};
let modelParams = {};
let searchTerm = '';
let sortKey = '';
let sortAsc = true;

// ============================================================
// HELPERS
// ============================================================

function formatNumber(val) {
    if (val === undefined || val === null || val === '') return '-';
    const num = parseFloat(val);
    if (isNaN(num)) return val;
    if (Math.abs(num) < 0.0001) {
        return num.toExponential(2);
    }
    if (Number.isInteger(num)) {
        return num.toString();
    }
    return num.toPrecision(4);
}

// ============================================================
// DOM REFS
// ============================================================

const searchInput = document.getElementById('searchInput');
const tableHead = document.getElementById('tableHead');
const tableBody = document.getElementById('tableBody');
const emptyState = document.getElementById('emptyState');
const emptyMessage = document.getElementById('emptyMessage');
const loadingState = document.getElementById('loadingState');
const dataTable = document.getElementById('dataTable');
const debugInfo = document.getElementById('debugInfo');

// Modal
const modalOverlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');
const modalTitle = document.getElementById('modalTitle');
const modalModel = document.getElementById('modalModel');
const modalBody = document.getElementById('modalBody');

// ============================================================
// BUILD MODEL PARAMETERS
// ============================================================

// ============================================================
// BUILD MODEL PARAMETERS - avec Buckingham
// ============================================================

function buildModelParams(data) {
    const models = {};
    
    const modelNames = new Set();
    data.list.forEach(atom => modelNames.add(atom.model));
    
    modelNames.forEach(name => {
        models[name] = {
            name: name,
            atom_types: [],
            lj: [],
            buckingham: [],
            bonds: [],
            angles: [],
            impropers: [],
            ref: null,
            description: null
        };
    });
    
    data.list.forEach(atom => {
        if (models[atom.model]) {
            models[atom.model].atom_types.push({
                type: atom.type,
                element: atom.element,
                charge: atom.charge,
                environment: atom.environment,
                ref: atom.ref
            });
            if (!models[atom.model].ref && atom.ref) {
                models[atom.model].ref = atom.ref;
            }
        }
    });
    
    if (data.models) {
        Object.keys(data.models).forEach(name => {
            if (models[name]) {
                if (data.models[name].description) {
                    models[name].description = data.models[name].description;
                }
                if (data.models[name].ref) {
                    models[name].ref = data.models[name].ref;
                }
            }
        });
    }
    
    // LJ
    if (data['lj_12-6']) {
        data['lj_12-6'].forEach(lj => {
            if (models[lj.model]) {
                models[lj.model].lj.push(lj);
            }
        });
    }
    
    // Buckingham
    if (data.buckingham) {
        data.buckingham.forEach(buck => {
            if (models[buck.model]) {
                models[buck.model].buckingham.push(buck);
            }
        });
    }
    
    // Bonds
    if (data.bond) {
        data.bond.forEach(bond => {
            if (models[bond.model]) {
                models[bond.model].bonds.push(bond);
            }
        });
    }
    
    // Angles
    if (data.angle) {
        data.angle.forEach(angle => {
            if (models[angle.model]) {
                models[angle.model].angles.push(angle);
            }
        });
    }
    
    // Impropers
    if (data.improper) {
        data.improper.forEach(imp => {
            if (models[imp.model]) {
                models[imp.model].impropers.push(imp);
            }
        });
    }
    
    return models;
}

// ============================================================
// RENDER
// ============================================================

function render() {
    let data = Object.values(modelParams);
    
    if (searchTerm.trim()) {
        const term = searchTerm.trim().toLowerCase();
        data = data.filter(model => 
            model.name.toLowerCase().includes(term) ||
            model.atom_types.some(a => a.type.toLowerCase().includes(term)) ||
            (model.description && model.description.toLowerCase().includes(term))
        );
    }
    
    if (sortKey) {
        data.sort((a, b) => {
            const va = a[sortKey] ?? '';
            const vb = b[sortKey] ?? '';
            return sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
        });
    }
    
    renderTable(data);
}

function renderTable(data) {
    if (data.length === 0) {
        tableHead.innerHTML = '';
        tableBody.innerHTML = '';
        dataTable.style.display = 'none';
        emptyState.style.display = 'block';
        emptyMessage.textContent = searchTerm.trim() ? `No models found matching "${searchTerm}".` : 'No models found.';
        return;
    }
    
    emptyState.style.display = 'none';
    dataTable.style.display = 'table';
    
    const cols = ['model', 'description', 'atom_types_count', 'ref'];
    
    tableHead.innerHTML = `<tr>${cols.map(col => `
        <th data-col="${col}" class="${col === sortKey ? 'sorted' : ''}">
            ${col === 'model' ? 'Model' : col === 'description' ? 'Description' : col === 'atom_types_count' ? '# Atom Types' : 'Reference'}
            <span class="sort-icon">${col === sortKey ? (sortAsc ? '↑' : '↓') : '⇅'}</span>
        </th>
    `).join('')}</tr>`;
    
    tableHead.querySelectorAll('th').forEach(th => {
        th.addEventListener('click', () => {
            const col = th.dataset.col;
            if (col === sortKey) { sortAsc = !sortAsc; } 
            else { sortKey = col; sortAsc = true; }
            render();
        });
    });
    
    tableBody.innerHTML = data.map(model => {
        return `<tr>${cols.map(col => {
            let val = '';
            if (col === 'model') {
                val = `<a class="type-link model-link" data-model="${model.name}">${model.name}</a>`;
            } else if (col === 'description') {
                val = model.description || '-';
            } else if (col === 'atom_types_count') {
                val = model.atom_types.length;
            } else if (col === 'ref') {
                val = model.ref ? `<a href="${model.ref}" target="_blank" class="ref-link"><span class="material-symbols-outlined">article</span></a>` : '-';
            }
            return `<td>${val}</td>`;
        }).join('')}</tr>`;
    }).join('');
    
    document.querySelectorAll('.model-link[data-model]').forEach(el => {
        el.addEventListener('click', function(e) {
            e.stopPropagation();
            const modelName = this.dataset.model;
            if (modelParams[modelName]) {
                openModal(modelName);
            }
        });
    });
}

// ============================================================
// MODAL
// ============================================================

function openModal(modelName) {
    const data = modelParams[modelName];
    if (!data) return;
    
    modalTitle.textContent = modelName;
    modalModel.textContent = `${data.atom_types.length} atom types`;
    
    let html = '';
    
    if (data.description) {
        html += `<div style="margin-bottom:15px;color:var(--pst-color-text-muted, #6c757d);">${data.description}</div>`;
    }
    
    if (data.ref) {
        html += `<div style="margin-bottom:15px;font-size:13px;">Reference: <a href="${data.ref}" target="_blank">${data.ref}</a></div>`;
    }
    
    // Atom Types
    html += `<div class="modal-section"><h3>Atom Types <span class="count-badge">${data.atom_types.length}</span></h3>
        <table class="modal-subtable">
            <thead><tr><th>Type</th><th>Element</th><th>Charge</th><th>Environment</th></tr></thead>
            <tbody>`;
    data.atom_types.forEach(atom => {
        html += `<tr><td><strong>${atom.type}</strong></td><td>${atom.element || '-'}</td><td>${formatNumber(atom.charge)}</td><td>${atom.environment || '-'}</td></tr>`;
    });
    html += `</tbody></table></div>`;
    
    // LJ - avec vrais symboles
    if (data.lj.length > 0) {
        html += `<div class="modal-section"><h3>Lennard-Jones 12-6 <span class="count-badge">${data.lj.length}</span></h3>
            <table class="modal-subtable">
                <thead><tr><th>Type 1</th><th>Type 2</th><th>ε (kcal/mol)</th><th>σ (Å)</th></tr></thead>
                <tbody>`;
        data.lj.forEach(lj => {
            html += `<tr><td>${lj['type 1']}</td><td>${lj['type 2']}</td><td>${formatNumber(lj['epsilon (kcal/mol)'])}</td><td>${formatNumber(lj['sigma (A)'])}</td></tr>`;
        });
        html += `</tbody></table></div>`;
    }
    
    // Bonds - avec vrais symboles
    if (data.bonds.length > 0) {
        html += `<div class="modal-section"><h3>Bonds <span class="count-badge">${data.bonds.length}</span></h3>
            <table class="modal-subtable">
                <thead><tr><th>Type 1</th><th>Type 2</th><th>k (kcal/mol·Å²)</th><th>r₀ (Å)</th></tr></thead>
                <tbody>`;
        data.bonds.forEach(bond => {
            html += `<tr><td>${bond['type 1']}</td><td>${bond['type 2']}</td><td>${formatNumber(bond['k (kcal/(mol.A2)'])}</td><td>${formatNumber(bond['r (A)'])}</td></tr>`;
        });
        html += `</tbody></table></div>`;
    }
    
    // Angles - avec vrais symboles
    if (data.angles.length > 0) {
        html += `<div class="modal-section"><h3>Angles <span class="count-badge">${data.angles.length}</span></h3>
            <table class="modal-subtable">
                <thead><tr><th>Type 1</th><th>Type 2</th><th>Type 3</th><th>k (kcal/mol·rad²)</th><th>θ₀ (°)</th></tr></thead>
                <tbody>`;
        data.angles.forEach(angle => {
            html += `<tr><td>${angle['type 1']}</td><td>${angle['type 2']}</td><td>${angle['type 3']}</td><td>${formatNumber(angle['k (kcal/(mol.rad2))'])}</td><td>${formatNumber(angle['theta (deg)'])}</td></tr>`;
        });
        html += `</tbody></table></div>`;
    }
    
    // Impropers - avec vrais symboles
    if (data.impropers.length > 0) {
        html += `<div class="modal-section"><h3>Impropers <span class="count-badge">${data.impropers.length}</span></h3>
            <table class="modal-subtable">
                <thead><tr><th>Type 1</th><th>Type 2</th><th>Type 3</th><th>Type 4</th><th>k (kcal/mol·rad²)</th><th>θ₀ (°)</th></tr></thead>
                <tbody>`;
        data.impropers.forEach(imp => {
            html += `<tr><td>${imp['type 1']}</td><td>${imp['type 2']}</td><td>${imp['type 3']}</td><td>${imp['type 4']}</td><td>${formatNumber(imp['k (kcal/(mol,rad2))'])}</td><td>${formatNumber(imp['theta (deg)'])}</td></tr>`;
        });
        html += `</tbody></table></div>`;
    }
    
    modalBody.innerHTML = html;
    modalOverlay.classList.add('active');
}

function closeModal() {
    modalOverlay.classList.remove('active');
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

// ============================================================
// EVENT LISTENERS
// ============================================================

searchInput.addEventListener('input', (e) => {
    searchTerm = e.target.value;
    render();
});

// ============================================================
// INIT
// ============================================================

function init() {
    loadingState.style.display = 'block';
    dataTable.style.display = 'none';
    emptyState.style.display = 'none';
    debugInfo.className = 'debug-info';
    
    try {
        if (!EMBEDDED_DATA || typeof EMBEDDED_DATA !== 'object') {
            throw new Error('EMBEDDED_DATA is not defined');
        }
        if (!EMBEDDED_DATA.list || EMBEDDED_DATA.list.length === 0) {
            throw new Error('No data found');
        }
        
        allData = EMBEDDED_DATA;
        modelParams = buildModelParams(allData);
        
        loadingState.style.display = 'none';
        render();
        
        showDebug(`Loaded: ${Object.keys(modelParams).length} models`);
        console.log('Models loaded:', Object.keys(modelParams));
        
    } catch (error) {
        console.error('❌ Error:', error);
        loadingState.style.display = 'none';
        emptyState.style.display = 'block';
        emptyMessage.textContent = `⚠️ ${error.message}`;
        showDebug(`❌ ${error.message}`, true);
    }
}

function showDebug(message, isError = false) {
    debugInfo.className = 'debug-info show';
    debugInfo.style.color = isError ? '#dc3545' : '#28a745';
    debugInfo.innerHTML = message;
}

document.addEventListener('DOMContentLoaded', init);
</script>
